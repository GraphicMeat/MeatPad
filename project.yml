name: MeatPad
options:
  bundleIdPrefix: com.thecoldzero
  deploymentTarget:
    macOS: "14.0"
packages:
  MeatPadKit:
    path: MeatPadKit
  STTextView:
    url: https://github.com/GraphicMeat/STTextView
    revision: 8f9a6ee00272f78e66fa4683243a733a184ef85f
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  # LSP wire-protocol vocabulary only (Diagnostic, Position/LSPRange, CompletionItem,
  # Location, WorkspaceEdit, …) — the app needs to speak these types across every 0.7 LSP
  # feature (diagnostics now; completion/hover/goto-def/references/rename next). The actual
  # client/session machinery (LanguageClient, JSONRPC) stays inside MeatPadKit only,
  # reached through LSPProjectManager — never a direct app dependency. ProcessEnv is
  # the one exception (see below): the app uses it directly for PATH reconstruction.
  LanguageServerProtocol:
    url: https://github.com/ChimeHQ/LanguageServerProtocol
    from: 0.14.0
  # ProcessInfo.userEnvironment (PATH reconstruction for GUI-launched LSP detection,
  # see ProjectViewModel.init) is used directly by the app, not just MeatPadKit —
  # declared explicitly so it doesn't rely on transitive build-graph visibility.
  ProcessEnv:
    url: https://github.com/ChimeHQ/ProcessEnv
    from: 1.0.0
targets:
  MeatPad:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MeatPadKit
      - package: STTextView
        product: STTextView
      - package: Sparkle
        product: Sparkle
      - package: LanguageServerProtocol
        product: LanguageServerProtocol
      - package: ProcessEnv
        product: ProcessEnv
    preBuildScripts:
      - name: Ensure Info.plist (xcodegen output)
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/App/Info.plist
        script: |
          if [ ! -f "$SRCROOT/App/Info.plist" ]; then
            XCODEGEN="$(command -v xcodegen || echo /opt/homebrew/bin/xcodegen)"
            if [ -x "$XCODEGEN" ]; then
              echo "warning: App/Info.plist missing — regenerating via xcodegen"
              (cd "$SRCROOT" && "$XCODEGEN" generate)
            else
              echo "error: App/Info.plist missing and xcodegen not found. Run: xcodegen generate"
              exit 1
            fi
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MeatPad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Rokas"
        SUFeedURL: https://github.com/GraphicMeat/MeatPad/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: "9OobPkT0p5WGp0wf2aSbADivVllEKZaz0gKhElMocU0="
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "0.4.0"
