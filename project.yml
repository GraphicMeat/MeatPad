name: MeatPad
options:
  bundleIdPrefix: com.thecoldzero
  deploymentTarget:
    macOS: "14.0"
packages:
  MeatPadKit:
    path: MeatPadKit
  STTextView:
    url: https://github.com/GraphicMeat/STTextView
    revision: abe6b33c9876b3ce3071bbc7a489d6d9ac36eebf
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  # LSP wire-protocol vocabulary only (Diagnostic, Position/LSPRange, CompletionItem,
  # Location, WorkspaceEdit, …) — the app needs to speak these types across every 0.7 LSP
  # feature (diagnostics now; completion/hover/goto-def/references/rename next). The actual
  # client/session machinery (LanguageClient, JSONRPC) stays inside MeatPadKit only,
  # reached through LSPProjectManager — never a direct app dependency. ProcessEnv is
  # the one exception (see below): the app uses it directly for PATH reconstruction.
  LanguageServerProtocol:
    url: https://github.com/ChimeHQ/LanguageServerProtocol
    from: 0.14.0
  # ProcessInfo.userEnvironment (PATH reconstruction for GUI-launched LSP detection,
  # see ProjectViewModel.init) is used directly by the app, not just MeatPadKit —
  # declared explicitly so it doesn't rely on transitive build-graph visibility.
  ProcessEnv:
    url: https://github.com/ChimeHQ/ProcessEnv
    from: 1.0.0
targets:
  MeatPad:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MeatPadKit
      - package: STTextView
        product: STTextView
      - package: Sparkle
        product: Sparkle
      - package: LanguageServerProtocol
        product: LanguageServerProtocol
      - package: ProcessEnv
        product: ProcessEnv
    preBuildScripts:
      # First phase of every build: keeps the generated project in step with the folder on
      # disk. Xcode resolves the target's file list from the project it loaded BEFORE any
      # build phase runs, so this cannot rescue the build in flight — a just-added file is
      # missing from THIS compile and lands in the next one. That is the intended trade:
      # never blocks a build, and the following Run is always correct.
      # Only the file *set* and project.yml are fingerprinted, so ordinary edits never trip it.
      - name: Regenerate project when the file set changes (xcodegen)
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/App/Info.plist
        script: |
          set -eu
          cd "$SRCROOT"
          STAMP=".xcodegen-stamp"
          FINGERPRINT="$(find App Tests -type f ! -name '.DS_Store' | sort | shasum; shasum project.yml)"
          if [ -f "$STAMP" ] && [ "$FINGERPRINT" = "$(cat "$STAMP")" ] && [ -f App/Info.plist ]; then
            exit 0
          fi
          XCODEGEN="$(command -v xcodegen || echo /opt/homebrew/bin/xcodegen)"
          if [ ! -x "$XCODEGEN" ]; then
            echo "error: project needs regenerating and xcodegen isn't installed. Run: brew install xcodegen"
            exit 1
          fi
          "$XCODEGEN" generate
          # Re-read: generate writes App/Info.plist, which is itself part of the fingerprint.
          find App Tests -type f ! -name '.DS_Store' | sort | shasum > "$STAMP"
          shasum project.yml >> "$STAMP"
          echo "warning: project regenerated (files added, removed, or project.yml changed) — new files build on the next Run"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MeatPad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Rokas"
        SUFeedURL: https://github.com/GraphicMeat/MeatPad/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: "9OobPkT0p5WGp0wf2aSbADivVllEKZaz0gKhElMocU0="
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.13.0"
        CURRENT_PROJECT_VERSION: "0.13.0"
  MeatPadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/MeatPadUITests
    dependencies:
      - target: MeatPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  MeatPad:
    build:
      targets:
        MeatPad: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeatPadUITests
